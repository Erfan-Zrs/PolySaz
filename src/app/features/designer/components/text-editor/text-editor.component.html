<ng-container *transloco="let t">
  <label class="field__label" for="text-content">{{ t('designer.text.content') }}</label>
  <textarea
    #textInput
    id="text-content"
    class="min-h-16 w-full resize-y rounded-md border border-border bg-surface p-2 text-[18px] leading-normal text-text focus:border-primary focus:outline-none"
    rows="2"
    dir="auto"
    [style.font-family]="fontFamily()"
    [value]="textStyle().text"
    (input)="onText($event)"
  ></textarea>

  <div class="flex gap-1" role="group" [attr.aria-label]="t('designer.text.font.label')">
    @for (font of fonts; track font.id) {
      <button
        type="button"
        class="h-9 flex-1 rounded-sm border border-border bg-surface px-2 text-[16px] text-text cursor-pointer aria-pressed:border-primary aria-pressed:bg-primary-soft aria-pressed:text-primary"
        [style.font-family]="cssFamily(font.family)"
        [attr.aria-pressed]="textStyle().font === font.id"
        (click)="update({ font: font.id })"
      >
        {{ t('designer.text.font.' + font.id) }}
      </button>
    }
  </div>

  <div class="flex justify-between gap-2" dir="ltr">
    <div class="segmented" role="group" [attr.aria-label]="t('designer.text.format')">
      @for (key of toggles; track key) {
        <button
          type="button"
          class="h-8 w-[34px] justify-center px-0 text-[16px]"
          [class.font-latin]="key !== 'italic'"
          [class.font-extrabold]="key === 'bold'"
          [class.italic]="key === 'italic'"
          [class.font-serif]="key === 'italic'"
          [class.underline]="key === 'underline'"
          [attr.aria-pressed]="textStyle()[key]"
          [attr.aria-label]="t('designer.text.' + key)"
          [title]="t('designer.text.' + key)"
          (click)="toggle(key)"
        >
          <span aria-hidden="true">{{ key === 'bold' ? 'B' : key === 'italic' ? 'I' : 'U' }}</span>
        </button>
      }
    </div>
    <div class="segmented" role="group" [attr.aria-label]="t('designer.text.align.label')">
      @for (align of aligns; track align) {
        <button
          type="button"
          class="h-8 w-[34px] justify-center px-0"
          [attr.aria-pressed]="textStyle().align === align"
          [attr.aria-label]="t('designer.text.align.' + align)"
          [title]="t('designer.text.align.' + align)"
          (click)="update({ align })"
        >
          <svg class="icon size-5" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6h16M4 18h16" />
            @switch (align) {
              @case ('left') {
                <path d="M4 12h10" />
              }
              @case ('center') {
                <path d="M7 12h10" />
              }
              @case ('right') {
                <path d="M10 12h10" />
              }
            }
          </svg>
        </button>
      }
    </div>
  </div>

  <app-color-picker
    [color]="textStyle().color"
    [label]="t('designer.text.color.label')"
    (colorChange)="update({ color: $event })"
  />
</ng-container>
