<article
  class="card flex h-full flex-col overflow-hidden transition-[box-shadow,translate] duration-200 ease-[ease] hover:-translate-y-0.5 hover:shadow-md motion-reduce:transition-none motion-reduce:hover:translate-none"
  *transloco="let t"
>
  <div class="bg-surface-2 py-4">
    @if (spec(); as spec) {
      <app-case-poster class="h-[260px]" [spec]="spec" [design]="design()" />
    }
  </div>
  <div class="flex flex-1 flex-col gap-1 p-4">
    <p class="text-[12px] font-semibold text-primary">
      {{ t('catalog.categories.' + design().category) }}
    </p>
    <h3 class="text-[17px]">{{ t('catalog.designs.' + design().id + '.name') }}</h3>
    <p class="flex-1 text-[13px] text-muted">
      {{ t('catalog.designs.' + design().id + '.description') }}
    </p>
    <div class="mt-3 flex items-center justify-between gap-2">
      <span class="font-bold">{{ design().price | price }}</span>
      <button
        type="button"
        class="btn-cta btn-cta--sm"
        [disabled]="!spec() || busy()"
        (click)="onCustomize()"
      >
        {{ t('catalog.customize') }}
      </button>
    </div>
  </div>
</article>
